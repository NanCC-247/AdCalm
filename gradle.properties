org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# 非 ASCII 路径的两个绕行开关。
#
# app/build.gradle.kts 里会【运行时检测】项目路径是否含非 ASCII 字符：
# 含的话把构建产物重定向到纯 ASCII 路径（JVM 类加载器加载不了含中文的类路径条目，
# 单元测试 worker 会直接报 ClassNotFoundException）。正常路径的项目不受影响。
#
# 这个开关是配套的——AGP 默认拒绝非 ASCII 路径，而该检查源自 2014 年的 aapt 缺陷，
# 现代 aapt2 已能正确处理 UTF-8 路径。在 ASCII 路径的项目上它只是个无害的空开关。
android.overridePathCheck=true

kotlin.code.style=official
