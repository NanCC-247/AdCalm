name: CI

# 这个项目所有的单元测试都是纯逻辑测试（core/ 和 rules/ 里全是纯函数），
# 不需要真机也不需要模拟器，所以在普通 Linux runner 上就能全部跑完。
# 仪器测试（androidTest）需要设备，不在这里跑。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠ 这里**故意不用 `android-actions/setup-android`**。
      #
      # 它内部会执行 `sdkmanager tools`，而 `tools` 这个包早已从 SDK 仓库下架，
      # 于是这个 action 自己就报 `Failed to find package 'tools'` 退出 1 ——
      # **后面的测试、Lint、打包一步都不会跑**。2026-10-05 第一次推送时就是这么死的，
      # 连着三次全红，而日志里一个字的代码错误都没有。
      #
      # GitHub 的 ubuntu 镜像**本来就预装了 Android SDK 和 cmdline-tools**，
      # 所以直接用它的 sdkmanager 装我们要的那几个包就行，少一个会坏的依赖。
      # 版本号跟着 app/build.gradle.kts 里的 compileSdk 走，改那里时记得改这里。
      - name: 安装本项目要的 SDK 平台与构建工具
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager，下面把 SDK 目录列出来便于排查"
            ls -R "${ANDROID_HOME:-/usr/local/lib/android/sdk}" | head -60
            exit 1
          fi
          echo "用 $SDKMANAGER"
          # 同意许可。这一步返回非 0 是正常的（它把没答完的许可也报出来），忽略掉。
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 这里刻意直接调 ./gradlew，不调 build.sh。
      # build.sh 会先 source env.sh，而 env.sh 会把 GRADLE_USER_HOME 指到项目内，
      # 让上面的缓存失效。CI 里不需要那套本机工具链逻辑。
      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: 装配 Debug APK
        run: ./gradlew --no-daemon assembleDebug

      # 出一个可下载的调试包。
      #
      # **为什么是 artifact，而不是挂到 Release 资产上**——这是刻意的取舍：
      # 仓库的红线是"只发布源码、不发布可直接安装的成品 APK"（见 README 的
      # 「分享与法律风险」）。artifact 和 Release 资产的区别是实质性的：
      # 它是一次性的构建产物，**必须登录 GitHub 才能下载**，而且到期自动删除；
      # 仓库和 Release 里**始终没有任何 APK 文件**，那条红线的字面和精神都没破。
      #
      # 想自己装的开发者从 Actions 页面拿这个就够了；"分发成品"那个动作没有发生。
      # 真要把它改成 Release 资产，先回去读一遍 README 那一节。
      - name: 上传调试包
        uses: actions/upload-artifact@v4
        with:
          name: adcalm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # 比默认的 90 天短：它是个方便开发者试用的构建产物，不是长期分发渠道。
          retention-days: 30
          # 打不出包时让这一步直接失败，别静默产出一个空的 artifact。
          if-no-files-found: error

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
