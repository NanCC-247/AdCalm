name: CI


on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装本项目要的 SDK 平台与构建工具
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager，下面把 SDK 目录列出来便于排查"
            ls -R "${ANDROID_HOME:-/usr/local/lib/android/sdk}" | head -60
            exit 1
          fi
          echo "用 $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Release Lint 和无密钥编译
        run: ./gradlew --no-daemon lintRelease assembleRelease

      - name: 装配 Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: 整理 CI 调试构建（开发验证）
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/adcalm-${GITHUB_SHA::7}.apk"
          ls -la dist

      - name: 上传 CI 调试构建（非正式签名）
        uses: actions/upload-artifact@v4
        with:
          name: adcalm-debug-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
