name: CI

# 这个项目所有的单元测试都是纯逻辑测试（core/ 和 rules/ 里全是纯函数），
# 不需要真机也不需要模拟器，所以在普通 Linux runner 上就能全部跑完。
# 仪器测试（androidTest）需要设备，不在这里跑。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      # setup-android 只保证 SDK 目录和 platform-tools 在，**不保证装了这个项目要的那几个
      # 包**（它默认装的是"当时最新"，而本项目 compileSdk = 35 是钉死的）。
      # 少了这一行，跑在版本更新的 runner 上时会报 "Failed to find target with hash string
      # 'android-35'"——而 CI 红了第一次之后，很容易被当成"项目本来就编不过"。
      # 版本号跟着 app/build.gradle.kts 里的 compileSdk 走，改那里时记得改这里。
      - name: 安装本项目要的 SDK 平台与构建工具
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 这里刻意直接调 ./gradlew，不调 build.sh。
      # build.sh 会先 source env.sh，而 env.sh 会把 GRADLE_USER_HOME 指到项目内，
      # 让上面的缓存失效。CI 里不需要那套本机工具链逻辑。
      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: 装配 Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
