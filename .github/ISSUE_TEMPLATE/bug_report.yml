name: 问题反馈
description: 反馈识别、误点、回退、下载处置或界面问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请描述可复现的场景。日志或截图有助于排查，但不是提交问题的前提。
        分享前请遮盖账号、聊天内容、通知、个人路径等私人信息。
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 广告未被跳过
        - 点击了不该点击的位置
        - 误跳回退或强停异常
        - 下载隔离、恢复或手动清理异常
        - 权限、后台运行或能力自检异常
        - 界面或其他问题
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AdCalm 版本
      placeholder: 例如 v0.1.0；如为自行构建，也可提供提交号
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 机型 / Android 版本 / 厂商系统版本
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: 涉及的应用
      description: 提供应用名称与版本；包名可选。
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: 复现步骤与实际结果
      description: 说明操作步骤、期待的结果与实际发生的情况。
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 复现时的模式
      options:
        - 自动模式
        - 纯观察模式
        - 不确定
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: 相关状态
      description: 如有必要，说明是否已选择该应用、无障碍是否运行、Shizuku 与能力自检结果。
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: 日志或截图（可选）
      description: 只提交相关且已脱敏的片段；需要诊断时短时开启，复现后关闭。
    validations:
      required: false
