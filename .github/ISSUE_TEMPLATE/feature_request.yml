name: 功能建议
description: 分享使用场景和希望改进的体验
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        欢迎围绕减少打扰、操作可控、兼容性与清晰反馈提出建议。
        当前功能和边界见 README；无需参考本地开发记录。
        请描述正常使用场景及用户控制方式；不以特定平台全覆盖或绕过其限制为目标。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述具体场景、当前困难和影响。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到什么结果
      description: 说明怎样的行为或体验能解决这个问题。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 建议方案（可选）
      description: 如有替代做法或参考，也可以一起说明。
    validations:
      required: false
